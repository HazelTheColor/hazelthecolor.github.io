<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="graphics/star.ico">
      <title>Well, there was not a man here.</title>
    </head>
    <style>
      body {
        background-color: #151515;
        font-family: Helvetica;
      }
      
      .text {
	      color: #cccccc;
	    }
      
      .modeButton {
        cursor: pointer;
        width: 125px;
        height: 30px;
        margin: auto;
        background-color: #abcdef;
      }
      
      .modeButton:hover {
        background-color: #d4e9ff;
      }
      
      .box1 {
        width: 500px;
        padding: 10px;
        margin: auto;
        text-align: center;
      }
      
      .theme {
        position: absolute;
        top: 5px;
        right: 5px;
      }
    </style>

    <script type="text/javascript">
      // -- Dark/Light mode button
      var button="t";
      function mode() {
        var btn1 = document.getElementById("btn");
        var bdv = document.getElementsByTagName("BODY")[0];
          if (button=="t") {
            btn1.value="dark mode";
            button="f";
            light()
          }
          else {
            btn1.value="light mode";
            button="t";
            dark()
          }
        function light() {
          const ltext = document.querySelectorAll(".text");
          for (let a=0; a<ltext.length; a++) {
            ltext[a].style.color="#151515";
            bdv.style.backgroundColor="white";
          }
        }
        function dark() {
          const dtext = document.querySelectorAll(".text");
          for (let b=0; b<dtext.length; b++) {
            dtext[b].style.color="#cccccc";
            bdv.style.backgroundColor="#151515";
          }
        }
      }
    </script>

    <body>
      <div class="theme">
        <input class="modeButton" type="button" value="light mode" id="btn" onclick="mode();">
      </div>
      <div class="text box1">
        <p style="margin:0px; font-size:20px;">interesting...</p>
        <p style="margin:0px; font-size:20px;">wah</p>
      </div>
    </body>
  </html>

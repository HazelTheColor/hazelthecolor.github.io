<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="graphics/star.ico">
      <title>...?</title>
    </head>

    <style>
      body {
        background-color: #151515;
        font-family: Helvetica;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      
      .text {
	      color: #cccccc;
	    }
    </style>

    <script>
      const pathSegments = window.location.pathname.split('/').filter(Boolean);
      const matched = pathSegments[0] === 'helper';

      if (matched) {
        const slug = pathSegments.slice(1).join('/');
        window.location.replace(`/${matched}/?slug=${encodeURIComponent(slug)}`);

      } else {
        document.body.innerHTML = '<a href="https://deltarune.com/egg"><img src="graphics/tree.gif"></a>'
      }
    </script>

    <body>
      <a href="https://deltarune.com/egg"><img src="graphics/tree.gif"></a>
    </body>
  </html>

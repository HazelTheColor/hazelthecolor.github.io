<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="graphics/star.ico">
      <title>owo</title>
    </head>
    <style>
      body {
        background-color: #151515;
        font-family: Helvetica;
      }
      
      .text {
	      color: #cccccc;
	    }
      
      .modeButton {
        cursor: pointer;
        width: 125px;
        height: 30px;
        margin: auto;
        background-color: #abcdef;
      }
      
      .modeButton:hover {
        background-color: #d4e9ff;
      }
      
      .box1 {
        width: 500px;
        padding: 10px;
        margin: auto;
        text-align: center;
      }
      
      .theme {
        position: absolute;
        top: 5px;
        right: 5px;
      }
    </style>

    <script type="text/javascript">
      // -- Dark/Light mode button
      var button="t";
      function mode() {
        var btn1 = document.getElementById("btn");
        var bdv = document.getElementsByTagName("BODY")[0];
          if (button=="t") {
            btn1.value="dark mode";
            button="f";
            light()
          }
          else {
            btn1.value="light mode";
            button="t";
            dark()
          }
        function light() {
          const ltext = document.querySelectorAll(".text");
          for (let a=0; a<ltext.length; a++) {
            ltext[a].style.color="#151515";
            bdv.style.backgroundColor="white";
          }
        }
        function dark() {
          const dtext = document.querySelectorAll(".text");
          for (let b=0; b<dtext.length; b++) {
            dtext[b].style.color="#cccccc";
            bdv.style.backgroundColor="#151515";
          }
        }
      }
    </script>

    <script type="text/javascript">

      const CODE_SECRET = ['U', 'L', 'DR', 'UR', 'L', 'UL'];

      const DIRECTION = {
        'a,w': 'UL', 'w,a': 'UL',
        'd,w': 'UR', 'w,d': 'UR',
        'a,s': 'DL', 's,a': 'DL',
        'd,s': 'DR', 's,d': 'DR',
        'w': 'U',
        's': 'D',
        'a': 'L',
        'd': 'R',
      };
      let lastKey = '';
      let userInput = [];
      let timer = null;

      document.addEventListener('keydown', (event) => {

        if (event.repeat) return;
        const currentKey = event.key.toLowerCase();

        if (timer) {
          clearTimeout(timer);
          timer = null;

          const keyPair = `${lastKey},${currentKey}`;
          const direction = DIRECTION[keyPair];
          if (direction) addDir(direction);

        } else {
          timer = setTimeout(() => {
            timer = null;

            const direction = DIRECTION[lastKey];
            if (direction) addDir(direction);
            lastKey = '';
          }, 100);
        }
        lastKey = currentKey;
      });

      function addDir(direction) {
        userInput.push(direction);

        if (userInput.length > 6) {
          userInput.shift();
        }
        
        if (userInput.length === 6 && userInput.join(',') === CODE_SECRET.join(',')) {
          window.location.href = "https://hazelthecolor.github.io/helper/";
        }
      }
    </script>

    <body>
      <div class="theme">
        <input class="modeButton" type="button" value="light mode" id="btn" onclick="mode();">
      </div>
      <div class="text box1">
        <p style="margin:0px; font-size:30px;">haiiii ^-^</p>
        <p style="margin:0px">welcome to my page :3</p>
        <br>
        <img src="graphics/pluey.gif" alt="pluey.gif">
        <br>
        <p style="margin:20px">there is nothing here (yet)</p>
      </div>
    </body>
  </html>

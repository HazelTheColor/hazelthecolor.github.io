<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="../graphics/star.ico">
      <title>sevenfour.ogg</title>
      <script src="_useful.js"></script>
    </head>
    
    <style id="style">
      body {
        background-color: #151515;
        font-family: Helvetica;
        margin: 0;
        padding: 0;

        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      
      .text {
	      color: #cccccc;
	    }

      input {
        background-color: #2e295a;
      }
      
      input:hover {
        background-color: #35476a;
      }

      #base1, #base2, #inputstring, #convert, #copy {
        color: #cccccc;
        font-size: 24px;
        text-align: center;

        margin: 0px;
        border: 2px solid #cccccc;
        outline: none;
        box-sizing: border-box;

        position: absolute;
      }

      #base1 {
        width: 80px;
        height: 40px;
        top: 0px;
        left: 20px;
      }

      #base2 {
        width: 80px;
        height: 40px;
        top: 0px;
        right: 20px;
      }

      #inputstring {
        width: 400px;
        height: 40px;
        top: 80px;
      }

      #output {
        font-size: 24px;
        text-align: center;

        position: relative;
        width: 100vw;
        margin-left: -50vw;
        margin-top: 0px;
        margin-bottom: 0px;
        left: 50%;
        top: 200px;
      }

      #convert {
        font-size: 20px;
        background-color: #723a69;

        width: 150px;
        height: 40px;
        top: 140px;
        left: 125px;
      }

      #convert:hover {
        background-color: #ae489d;
      }

      #copy {
        background-color: #723a69;
        background-image: url("../graphics/saveicon.png");

        width: 40px;
        height: 40px;
        bottom: 0px;
        right: 0px;
      }

      #copy:hover {
        background-color: #ae489d;
        background-image: url("../graphics/saveicon_hover.png");
      }
    </style>

    <body>
      <div style="width: 400px; height: 300px; position: relative">
        <input id="base1" autocomplete="off" maxlength="4" placeholder="94">
        <input id="base2" autocomplete="off" maxlength="4" placeholder="10">
        <input id="inputstring" autocomplete="off">
        <button id="convert" onclick="start()">(✿◠‿◠)</button>
        <p id="output" class="text">:3</p>
        <button id="copy" onclick="copyText()"></button>
      </div>
    </body>

    <script>
        function start() {
            const fromBase = parseInt(document.getElementById("base1").value);
            const toBase = parseInt(document.getElementById("base2").value);
            const input = document.getElementById("inputstring").value;

            let o = baseConvert(fromBase, toBase, input);

            if (o == "error") {
              window.location.href = "https://hazelthecolor.github.io/...?";
            } else {
              document.getElementById("output").innerHTML = o;
            }
        }

        function copyText() {
            var text = document.getElementById("output").textContent;
            navigator.clipboard.writeText(text);
        }
    </script>
  </html>

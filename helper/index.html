<!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="icon" href="../graphics/star.ico">
      <title>sevenfour.ogg</title>

      <script src="js/carps.js"></script>
      <script src="js/posres.js"></script>
    </head>
    
    <style id="style">
      body {
        background-color: #151515;
        font-family: Helvetica;
        margin: 0;
        padding: 0;
        
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
      }
      
      .text {
	      color: #cccccc;
	    }
    </style>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      if (slug) {
        window.history.replaceState(null, '', `/helper/${slug}`);

        const switchF = () => {
          switch(slug) {

            case "carps":
              loadCarps();
              break;
            
            case "posres":
              loadPosRes();
              break;
            
            default:
              window.location.href = "https://hazelthecolor.github.io/...?";
          }
        };

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", switchF);
        } else {
          switchF();
        }
      }
    </script>

    <body>
      <p class="text">hm?</p>
    </body>
  </html>

    <script>
      const path = window.location.pathname;
      const segments = path.split('/').filter(Boolean);

      const pageType = segments[0];
      const slug = segments[1];

      switch (pageType) {
        case 'helper':
          switchHelper(slug);
          break;

        default:
          document.body.innerHTML = '<a href="https://deltarune.com/egg"><img src="graphics/tree.gif"></a>';
      }

      function switchHelper(slug) {
        console.log("slug:", slug);
      }
    </script>
